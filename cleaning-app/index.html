                {[{k:"name",l:"お名前",t:"text",p:"山田 太郎"},{k:"tel",l:"電話番号",t:"tel",p:"090-0000-0000"},{k:"email",l:"メールアドレス",t:"email",p:"you@example.com"},{k:"date",l:"ご希望日（任意）",t:"date",p:""}].map(({k,l,t,p})=>(
                  <div key={k}><label className="text-xs text-gray-500 mb-1 block">{l}{k!=="date"&&<span className="text-red-400 ml-0.5">*</span>}</label>
                  <input type={t} placeholder={p} value={form[k]} onChange={(e)=>setForm(f=>({...f,[k]:e.target.value}))} className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" /></div>
                ))}
                <div><label className="text-xs text-gray-500 mb-1 block">ご要望・備考（任意）</label><textarea rows={3} placeholder="気になる汚れ、時間帯など" value={form.note} onChange={(e)=>setForm(f=>({...f,note:e.target.value}))} className="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-400" /></div>
                <button className="w-full bg-gradient-to-r from-green-500 to-green-600 text-white font-bold py-3.5 rounded-xl shadow-lg text-sm active:scale-[0.98]" onClick={()=>alert("【デモ】送信\n合計: "+fmt(gt))}>この内容で問い合わせる</button>
                <div className="flex gap-2">
                  <button className="flex-1 bg-green-50 text-green-700 font-bold py-3 rounded-xl text-sm border border-green-200" onClick={()=>alert("LINE送信")}>📱 LINE</button>
                  <button className="flex-1 bg-blue-50 text-blue-700 font-bold py-3 rounded-xl text-sm border border-blue-200" onClick={()=>alert("電話発信")}>📞 電話</button>
                </div>
                <p className="text-xs text-gray-400 text-center">※ 最終金額は現地確認後に確定</p>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-lg mx-auto min-h-screen bg-gray-50">
          <div className="bg-gradient-to-r from-blue-600 to-blue-700 p-5 pb-4 sticky top-0 z-20 shadow-md">
            <h1 className="text-white font-bold text-base">おそうじ本舗 大井町店</h1>
            <p className="text-blue-100 text-xs mt-0.5">クリーニングメニューを選択してください</p>
          </div>
          <div className="sticky top-[76px] z-10 bg-gray-50 px-4 pt-3 pb-2">
            <div className="flex gap-2 flex-wrap">{cats.map((c) => <button key={c} onClick={() => setFCat(c)} className={`px-3 py-1.5 rounded-full text-xs font-medium transition-colors ${fCat === c ? "bg-blue-500 text-white" : "bg-white text-gray-600 border border-gray-200"}`}>{c}</button>)}</div>
          </div>
          <div className="px-4 pt-2 pb-32 space-y-3">
            {filtered.map((svc) => {
              const active = !!sel[svc.id]; const sl = sel[svc.id]; const qty = sl?.qty || 1; const sub = calcTotal(svc, sl);
              return (
                <div key={svc.id} className={`rounded-xl border-2 transition-all ${active ? "border-blue-500 bg-white shadow-lg" : "border-gray-200 bg-white hover:border-gray-300"}`}>
                  <div className="p-4 cursor-pointer flex items-start gap-3" onClick={() => toggle(svc.id)}>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap"><CatBadge cat={svc.category} /><span className="font-bold text-gray-900 text-sm">{svc.name}</span></div>
                      <p className="text-xs text-gray-500 mt-1">{svc.desc}</p>
                      {svc.detail && (
                        <div className="mt-1">
                          <InfoBtn open={!!svcDetail[svc.id]} onClick={() => setSvcDetail((p) => ({ ...p, [svc.id]: !p[svc.id] }))} label="詳しく見る" />
                          {svcDetail[svc.id] && (
                            <div className="mt-2 bg-blue-50 rounded-lg p-3 space-y-2 text-xs animate-fadeIn" onClick={(e) => e.stopPropagation()}>
                              <div><p className="font-bold text-gray-700 mb-1">作業範囲</p><div className="flex flex-wrap gap-1">{svc.detail.scope.map((s) => <span key={s} className="bg-white text-gray-600 px-2 py-0.5 rounded-md border border-blue-100">{s}</span>)}</div></div>
                              <div><p className="font-bold text-gray-700 mb-0.5">所要時間</p><p className="text-gray-600">{svc.detail.time}</p></div>
                              {svc.detail.note && <div><p className="font-bold text-gray-700 mb-0.5">作業の流れ</p><p className="text-gray-600">{svc.detail.note}</p></div>}
                              {svc.detail.recommend && <div className="bg-white rounded-md p-2 border border-blue-100"><p className="font-bold text-blue-600 mb-0.5">こんな方におすすめ</p><p className="text-gray-600">{svc.detail.recommend}</p></div>}
                              <YoutubeEmbed url={svc.detail.youtube} />
                            </div>
                          )}
                        </div>
                      )}
                      <p className="text-sm font-bold text-blue-600 mt-1">{fmt(svc.variants[0].price1)}〜</p>
                    </div>
                    <div className={`w-6 h-6 rounded-md border-2 flex items-center justify-center flex-shrink-0 mt-1 ${active ? "bg-blue-500 border-blue-500" : "border-gray-300"}`}>{active && <span className="text-white text-sm font-bold">✓</span>}</div>
                  </div>
                  {active && (
                    <div className="px-4 pb-4 border-t border-gray-100 pt-3 space-y-3">
                      {svc.variants.length > 1 && <div><label className="text-xs font-medium text-gray-600 mb-1.5 block">タイプ</label><div className="flex gap-2 flex-wrap">{svc.variants.map((v) => <button key={v.id} onClick={() => upd(svc.id, { variantId: v.id })} className={`text-xs px-3 py-1.5 rounded-lg border font-medium ${sl.variantId === v.id ? "bg-blue-50 border-blue-400 text-blue-700" : "border-gray-200 text-gray-600"}`}>{v.label}（{fmt(v.price1)}）</button>)}</div></div>}
                      <div>
                        <label className="text-xs font-medium text-gray-600 mb-1.5 block">{svc.quantityLabel}</label>
                        <div className="flex items-center gap-1">{Array.from({ length: svc.maxQty }, (_, i) => i + 1).map((n) => <button key={n} onClick={() => { const nOQ = { ...(sl.optionQtys || {}) }; for (const oid of Object.keys(nOQ)) { const o = svc.options.find((x) => x.id === oid); if (o?.qtyable && nOQ[oid] > n) nOQ[oid] = n; } upd(svc.id, { qty: n, optionQtys: nOQ }); }} className={`w-9 h-9 rounded-lg text-sm font-bold border ${qty === n ? "bg-blue-500 text-white border-blue-500" : "border-gray-200 text-gray-600"}`}>{n}</button>)}</div>
                        {(() => { const v = svc.variants.find((x) => x.id === sl.variantId) || svc.variants[0]; return qty >= 2 && v.priceN < v.price1 ? <p className="text-xs text-green-600 mt-1 font-medium">2台以上割引適用！ 1台 {fmt(v.priceN)}</p> : null; })()}
                      </div>
                      {svc.options.length > 0 && <div><label className="text-xs font-medium text-gray-600 mb-1.5 block">オプション</label><div className="space-y-1.5">{svc.options.map((opt) => {
                        const oq = (sl.optionQtys || {})[opt.id] || 0; const isOn = oq > 0; const mx = opt.qtyable ? qty : 1;
                        const odk = svc.id + "_" + opt.id;
                        return (
                          <div key={opt.id} className={`p-2.5 rounded-lg text-sm ${isOn ? "bg-blue-50" : "hover:bg-gray-50"}`}>
                            {opt.qtyable ? (
                              <><div className="flex items-center gap-2"><div className="flex-1 min-w-0"><span className="text-gray-700">{opt.label}</span><span className="text-xs text-gray-400 ml-1">+{fmt(opt.price)}/{opt.per}</span></div><OQC value={oq} max={mx} onChange={(nq) => { const next = { ...(sl.optionQtys || {}), [opt.id]: nq }; if (nq === 0) delete next[opt.id]; upd(svc.id, { optionQtys: next }); }} />{isOn && <span className="text-xs text-blue-600 font-medium w-16 text-right">+{fmt(opt.price * oq)}</span>}</div>
                              {opt.detail && <InfoBtn open={!!optDetail[odk]} onClick={() => setOptDetail((p) => ({ ...p, [odk]: !p[odk] }))} />}
                              {optDetail[odk] && opt.detail && <div className="mt-1.5 bg-gray-50 rounded-lg p-2.5 text-xs animate-fadeIn border border-gray-100" onClick={(e) => e.stopPropagation()}><p className="text-gray-600 leading-relaxed">{opt.detail.text}</p><MediaGrid images={opt.detail.images} youtube={opt.detail.youtube} /></div>}</>
                            ) : (
                              <><label className="flex items-start gap-2 cursor-pointer"><input type="checkbox" checked={isOn} onChange={() => { const next = { ...(sl.optionQtys || {}), [opt.id]: isOn ? 0 : 1 }; if (next[opt.id] === 0) delete next[opt.id]; upd(svc.id, { optionQtys: next }); }} className="w-4 h-4 rounded accent-blue-500 mt-0.5" /><div className="flex-1"><span className="text-gray-700">{opt.label}</span></div><span className="text-xs text-gray-500 font-medium">+{fmt(opt.price)}/{opt.per}</span></label>
                              <div className="ml-6">{opt.detail && <InfoBtn open={!!optDetail[odk]} onClick={() => setOptDetail((p) => ({ ...p, [odk]: !p[odk] }))} />}{optDetail[odk] && opt.detail && <div className="mt-1.5 bg-gray-50 rounded-lg p-2.5 text-xs animate-fadeIn border border-gray-100" onClick={(e) => e.stopPropagation()}><p className="text-gray-600 leading-relaxed">{opt.detail.text}</p><MediaGrid images={opt.detail.images} youtube={opt.detail.youtube} /></div>}</div></>
                            )}
                          </div>
                        );
                      })}</div></div>}
                      <div className="bg-gray-50 rounded-lg p-3 flex justify-between items-center"><span className="text-xs text-gray-500">小計</span><span className="text-lg font-bold text-blue-600">{fmt(sub)}</span></div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          {sc > 0 && <div className="fixed bottom-0 left-0 right-0 z-30"><div className="max-w-lg mx-auto bg-white border-t shadow-2xl p-4 rounded-t-2xl"><div className="flex items-center justify-between"><div><p className="text-xs text-gray-500">{sc}件選択中</p><p className="text-xl font-bold text-blue-600">{fmt(gt)}<span className="text-xs text-gray-400 font-normal ml-1">（税込）</span></p></div><button onClick={() => setShowSum(true)} className="bg-gradient-to-r from-blue-500 to-blue-600 text-white font-bold px-6 py-3 rounded-xl shadow-lg text-sm active:scale-[0.98]">見積もりを確認 →</button></div></div></div>}
        </div>
      );
    };

    const Field = ({ label, value, onChange, type = "text", placeholder = "", textarea = false, small = false }) => (
      <div className={small ? "flex-1" : ""}>
        <label className="text-xs text-gray-500 mb-0.5 block">{label}</label>
        {textarea ? <textarea rows={2} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} className="w-full border border-gray-200 rounded px-2 py-1.5 text-sm resize-none focus:outline-none focus:ring-1 focus:ring-blue-400" />
        : <input type={type} value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} className="w-full border border-gray-200 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-400" />}
      </div>
    );

    const AdminView = ({ services, setServices }) => {
      const [editSvc, setEditSvc] = useState(null);
      const [editOpt, setEditOpt] = useState(null);

      const updSvc = (id, patch) => setServices((p) => p.map((s) => s.id === id ? { ...s, ...patch } : s));
      const updSvcDetail = (id, patch) => setServices((p) => p.map((s) => s.id === id ? { ...s, detail: { ...s.detail, ...patch } } : s));
      const delSvc = (id) => { if (confirm("このサービスを削除しますか？")) setServices((p) => p.filter((s) => s.id !== id)); };
      const addSvc = () => {
        const ns = { id: genId(), category: "エアコン", name: "新しいサービス", desc: "", detail: { scope: [], time: "", note: "", recommend: "", youtube: "" }, variants: [{ id: "std", label: "標準", price1: 10000, priceN: 10000 }], quantityLabel: "台数", maxQty: 4, options: [] };
        setServices((p) => [...p, ns]); setEditSvc(ns.id);
      };
      const updOpt = (svcId, optId, patch) => setServices((p) => p.map((s) => s.id === svcId ? { ...s, options: s.options.map((o) => o.id === optId ? { ...o, ...patch } : o) } : s));
      const updOptDetail = (svcId, optId, patch) => setServices((p) => p.map((s) => s.id === svcId ? { ...s, options: s.options.map((o) => o.id === optId ? { ...o, detail: { ...(o.detail || {}), ...patch } } : o) } : s));
      const delOpt = (svcId, optId) => setServices((p) => p.map((s) => s.id === svcId ? { ...s, options: s.options.filter((o) => o.id !== optId) } : s));
      const addOpt = (svcId) => {
        const no = { id: genId(), label: "新しいオプション", price: 0, per: "式", detail: { text: "", images: [], youtube: "" } };
        setServices((p) => p.map((s) => s.id === svcId ? { ...s, options: [...s.options, no] } : s));
        setEditOpt(svcId + "_" + no.id);
      };

      return (
        <div className="max-w-2xl mx-auto min-h-screen bg-gray-50 p-4">
          <div className="bg-white rounded-2xl shadow-lg overflow-hidden">
            <div className="bg-gradient-to-r from-gray-700 to-gray-800 p-5">
              <h2 className="text-white text-lg font-bold">管理画面 — サービスマスター</h2>
              <p className="text-gray-300 text-xs mt-0.5">メニュー・オプション・詳細情報の編集</p>
            </div>
            <div className="p-4 space-y-3">
              {services.map((svc) => {
                const isOpen = editSvc === svc.id;
                return (
                  <div key={svc.id} className="border border-gray-200 rounded-xl overflow-hidden">
                    <div className="p-3 flex items-center gap-2 cursor-pointer bg-gray-50 hover:bg-gray-100" onClick={() => setEditSvc(isOpen ? null : svc.id)}>
                      <CatBadge cat={svc.category} />
                      <span className="font-bold text-sm flex-1">{svc.name}</span>
                      <span className="text-xs text-gray-400">{svc.options.length}オプション</span>
                      <Chevron open={isOpen} cls="text-gray-400" />
                    </div>
                    {isOpen && (
                      <div className="p-4 space-y-4 border-t border-gray-100 animate-fadeIn">
                        <div className="grid grid-cols-2 gap-3">
                          <Field label="サービス名" value={svc.name} onChange={(v) => updSvc(svc.id, { name: v })} />
                          <Field label="カテゴリ" value={svc.category} onChange={(v) => updSvc(svc.id, { category: v })} />
                        </div>
                        <Field label="説明文" value={svc.desc} onChange={(v) => updSvc(svc.id, { desc: v })} />
                        <div className="grid grid-cols-2 gap-3">
                          <Field label="数量ラベル" value={svc.quantityLabel} onChange={(v) => updSvc(svc.id, { quantityLabel: v })} />
                          <Field label="最大数量" value={svc.maxQty} onChange={(v) => updSvc(svc.id, { maxQty: parseInt(v) || 1 })} type="number" />
                        </div>

                        <div className="bg-blue-50 rounded-lg p-3 space-y-2">
                          <p className="text-xs font-bold text-blue-700">サービス詳細（アコーディオン内）</p>
                          <Field label="作業範囲（カンマ区切り）" value={(svc.detail?.scope || []).join(",")} onChange={(v) => updSvcDetail(svc.id, { scope: v.split(",").map((s) => s.trim()).filter(Boolean) })} />
                          <Field label="所要時間" value={svc.detail?.time || ""} onChange={(v) => updSvcDetail(svc.id, { time: v })} />
                          <Field label="作業の流れ" value={svc.detail?.note || ""} onChange={(v) => updSvcDetail(svc.id, { note: v })} textarea />
                          <Field label="おすすめポイント" value={svc.detail?.recommend || ""} onChange={(v) => updSvcDetail(svc.id, { recommend: v })} textarea />
                          <Field label="YouTube URL" value={svc.detail?.youtube || ""} onChange={(v) => updSvcDetail(svc.id, { youtube: v })} placeholder="https://www.youtube.com/watch?v=..." />
                          {svc.detail?.youtube && <YoutubeEmbed url={svc.detail.youtube} />}
                        </div>

                        <div className="space-y-2">
                          <p className="text-xs font-bold text-gray-600">バリアント（価格タイプ）</p>
                          {svc.variants.map((v, vi) => (
                            <div key={v.id} className="flex gap-2 items-end">
                              <Field label="ラベル" value={v.label} onChange={(val) => { const nv = [...svc.variants]; nv[vi] = { ...nv[vi], label: val }; updSvc(svc.id, { variants: nv }); }} small />
                              <Field label="1台価格" value={v.price1} onChange={(val) => { const nv = [...svc.variants]; nv[vi] = { ...nv[vi], price1: parseInt(val) || 0 }; updSvc(svc.id, { variants: nv }); }} type="number" small />
                              <Field label="2台〜価格" value={v.priceN} onChange={(val) => { const nv = [...svc.variants]; nv[vi] = { ...nv[vi], priceN: parseInt(val) || 0 }; updSvc(svc.id, { variants: nv }); }} type="number" small />
                            </div>
                          ))}
                        </div>

                        <div className="space-y-2">
                          <div className="flex items-center justify-between"><p className="text-xs font-bold text-gray-600">オプション</p><button onClick={() => addOpt(svc.id)} className="text-xs text-blue-600 hover:text-blue-800 font-medium">+ 追加</button></div>
                          {svc.options.map((opt) => {
                            const odk = svc.id + "_" + opt.id; const oOpen = editOpt === odk;
                            return (
                              <div key={opt.id} className="border border-gray-200 rounded-lg overflow-hidden">
                                <div className="p-2 flex items-center gap-2 bg-gray-50 cursor-pointer hover:bg-gray-100" onClick={() => setEditOpt(oOpen ? null : odk)}>
                                  <span className="text-sm flex-1 font-medium">{opt.label}</span>
                                  <span className="text-xs text-gray-400">{fmt(opt.price)}/{opt.per}</span>
                                  <Chevron open={oOpen} cls="text-gray-300" />
                                </div>
                                {oOpen && (
                                  <div className="p-3 space-y-2 border-t border-gray-100 animate-fadeIn">
                                    <div className="grid grid-cols-2 gap-2">
                                      <Field label="ラベル" value={opt.label} onChange={(v) => updOpt(svc.id, opt.id, { label: v })} />
                                      <div className="flex gap-2">
                                        <Field label="価格" value={opt.price} onChange={(v) => updOpt(svc.id, opt.id, { price: parseInt(v) || 0 })} type="number" small />
                                        <Field label="単位" value={opt.per} onChange={(v) => updOpt(svc.id, opt.id, { per: v })} small />
                                      </div>
                                    </div>
                                    <label className="flex items-center gap-2 text-xs text-gray-600"><input type="checkbox" checked={!!opt.qtyable} onChange={(e) => updOpt(svc.id, opt.id, { qtyable: e.target.checked })} className="accent-blue-500" />数量個別選択を有効にする</label>

                                    <div className="bg-gray-50 rounded-lg p-2.5 space-y-2">
                                      <p className="text-xs font-bold text-gray-500">オプション詳細</p>
                                      <Field label="説明テキスト" value={opt.detail?.text || ""} onChange={(v) => updOptDetail(svc.id, opt.id, { text: v })} textarea />
                                      <Field label="画像URL（カンマ区切り）" value={(opt.detail?.images || []).join(",")} onChange={(v) => updOptDetail(svc.id, opt.id, { images: v.split(",").map((s) => s.trim()).filter(Boolean) })} placeholder="https://...jpg, https://...png" />
                                      <Field label="YouTube URL" value={opt.detail?.youtube || ""} onChange={(v) => updOptDetail(svc.id, opt.id, { youtube: v })} placeholder="https://www.youtube.com/watch?v=..." />
                                      {opt.detail?.youtube && <YoutubeEmbed url={opt.detail.youtube} />}
                                    </div>
                                    <button onClick={() => delOpt(svc.id, opt.id)} className="text-xs text-red-500 hover:text-red-700">このオプションを削除</button>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                        <button onClick={() => delSvc(svc.id)} className="text-xs text-red-500 hover:text-red-700 mt-2">このサービスを削除</button>
                      </div>
                    )}
                  </div>
                );
              })}
              <button onClick={addSvc} className="w-full border-2 border-dashed border-gray-300 rounded-xl p-4 text-gray-500 hover:border-blue-400 hover:text-blue-600 transition-colors text-sm font-medium">+ 新しいサービスを追加</button>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [services, setServices] = useState(DEFAULT_SERVICES);
      const [mode, setMode] = useState("customer");

      return (
        <div className="min-h-screen bg-gray-100">
          <style>{`@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}.animate-fadeIn{animation:fadeIn .2s ease-out}`}</style>
          <div className="fixed top-2 right-2 z-50 flex bg-white rounded-full shadow-lg border border-gray-200 p-0.5">
            <button onClick={() => setMode("customer")} className={`px-3 py-1.5 rounded-full text-xs font-medium transition-colors ${mode === "customer" ? "bg-blue-500 text-white" : "text-gray-600 hover:text-blue-600"}`}>お客様画面</button>
            <button onClick={() => setMode("admin")} className={`px-3 py-1.5 rounded-full text-xs font-medium transition-colors ${mode === "admin" ? "bg-gray-700 text-white" : "text-gray-600 hover:text-gray-800"}`}>管理画面</button>
          </div>
          {mode === "customer" ? <CustomerView services={services} /> : <AdminView services={services} setServices={setServices} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
